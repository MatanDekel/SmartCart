<!doctype html>
<html lang="he" dir="rtl" class="auth-pending">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מה קונים השבוע</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2D6A3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SmartCart">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F2; --surface:#FFFFFF; --ink:#1E2922; --muted:#617066;
  --line:#DCE3D6; --green:#2D6A3E; --green-soft:#E3EEE2; --tag:#F3C433; --tag-ink:#3A2C00;
  --danger:#B23A2E;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A16; --surface:#1C241F; --ink:#E8EEE8; --muted:#9AAAA0;
    --line:#2E3A32; --green:#7CC48E; --green-soft:#24362A; --tag:#E9B92A; --tag-ink:#2A2000;
    --danger:#F08A7E; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A16; --surface:#1C241F; --ink:#E8EEE8; --muted:#9AAAA0;
  --line:#2E3A32; --green:#7CC48E; --green-soft:#24362A; --tag:#E9B92A; --tag-ink:#2A2000;
  --danger:#F08A7E; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Assistant",system-ui,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 100px}

header h1{font-family:"Secular One","Assistant",sans-serif;font-weight:400;font-size:clamp(26px,7vw,34px);line-height:1.05;margin:2px 0 4px;letter-spacing:-.5px}
header p{margin:0;color:var(--muted)}
.sync{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}

.search{display:block;width:100%;margin:12px 0 0;padding:11px 14px;border:1.5px solid var(--ink);border-radius:12px;background:var(--surface);font-size:16px}
.addbox{margin:8px 0 6px;display:flex;gap:6px;flex-wrap:wrap}
.addbox input{flex:1 1 200px;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.addbox select{flex:1 1 140px;padding:10px 8px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.addbox button{flex:0 0 auto;padding:10px 16px;border:0;border-radius:12px;background:var(--green);color:var(--bg);font-weight:700;cursor:pointer}
.hint{font-size:14px;color:var(--muted);margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.cat{margin-top:10px}
.cat summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:6px 0 3px;border-bottom:2px solid var(--ink)}
.cat summary::-webkit-details-marker{display:none}
.cat summary h2{font-family:"Secular One","Assistant",sans-serif;font-weight:400;font-size:19px;margin:0;flex:1}
.cat summary .cnt{font-size:14px;color:var(--muted)}
.cat summary .chev{transition:transform .2s;color:var(--muted)}
.cat[open] summary .chev{transform:rotate(90deg)}

.row{display:flex;align-items:center;gap:8px;padding:2px;border-bottom:1px solid var(--line);min-height:42px}
.row .name{flex:1;background:none;border:0;text-align:right;padding:8px 0;cursor:pointer;font-size:16px}
.row.on .name{font-weight:700}
.step{display:flex;align-items:center;gap:2px}
.step button{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:15px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step .q{min-width:42px;text-align:center;font-weight:700;padding:2px 6px}
.row.on .step .q{background:var(--tag);color:var(--tag-ink);border-radius:6px 14px 14px 6px;position:relative}
.row.on .step .q::before{content:"";position:absolute;right:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--bg)}
.row:not(.on) .step .minus{visibility:hidden}
.unit{flex:0 0 auto;padding:5px 4px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px;max-width:76px}
.catmove{flex:0 1 auto;max-width:42%;padding:5px 4px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:14px}
.catdel{padding:8px 0 2px}
.del{border:1.5px solid var(--danger);background:none;color:var(--danger);font-size:14px;font-weight:600;cursor:pointer;padding:4px 12px;border-radius:8px}

/* shopping mode */
.list .row{cursor:pointer}
.list .row .check{width:24px;height:24px;border-radius:7px;border:2px solid var(--green);flex:0 0 auto;display:grid;place-items:center}
.list .row.done .check{background:var(--green)}
.list .row.done .check::after{content:"";width:7px;height:12px;border:solid var(--bg);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.list .row .ltxt{flex:1}
.list .row.done .ltxt{text-decoration:line-through;color:var(--muted)}
.list .row .lq{white-space:nowrap;font-weight:700;background:var(--tag);color:var(--tag-ink);padding:2px 10px;border-radius:6px 14px 14px 6px}
.list .row.done .lq{background:var(--line);color:var(--muted)}
.progress{margin:10px 0 4px;font-weight:600}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}

.empty{margin-top:40px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.finish{margin-top:20px;width:100%;padding:14px;border-radius:14px;border:2px solid var(--green);background:transparent;color:var(--green);font-weight:700;font-size:17px;cursor:pointer}
.ghost{background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;padding:4px 0;font-size:14px;font-weight:600}
.finish.armed{background:var(--green);color:var(--bg)}

nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs button{flex:1;max-width:300px;padding:12px;border-radius:12px;border:0;background:transparent;font-weight:700;font-size:16px;cursor:pointer;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--green-soft);color:var(--green)}
nav.tabs .badge{display:inline-block;min-width:22px;padding:0 6px;margin-inline-start:6px;border-radius:11px;background:var(--tag);color:var(--tag-ink);font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1;pointer-events:auto}
.toast{display:flex;align-items:center;gap:12px}
.toast button{background:none;border:0;color:var(--tag);font-weight:700;cursor:pointer;padding:2px 4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
.auth-pending body{visibility:hidden}
.userbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:2px;flex-wrap:wrap}
.userbar button{background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;font-size:13px;font-weight:600;padding:2px 0}
nav.tabs button{padding:12px 6px}
.fam h3{font-family:"Secular One","Assistant",sans-serif;font-weight:400;font-size:19px;margin:20px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
.fam .row{min-height:44px}
.fam .who{flex:1;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fam .tagme{font-size:13px;color:var(--muted)}
.fam .linkbox{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.fam .linkbox input{flex:1 1 220px;min-width:0;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);direction:ltr;font-size:14px}
.fam .btn{padding:10px 14px;border-radius:12px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-weight:700;cursor:pointer}
.fam .btn.solid{background:var(--green);color:var(--bg);border-color:var(--green)}
.fam p{margin:6px 0;color:var(--muted);font-size:15px}
.leave{margin-top:28px}
#offer:empty{display:none}
#offer{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--green-soft);border:1.5px solid var(--green)}
#offer p{margin:0 0 8px;font-weight:600}
#offer .acts{display:flex;gap:8px;flex-wrap:wrap}
#offer button{padding:8px 14px;border-radius:10px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-weight:700;cursor:pointer}
#offer button.solid{background:var(--green);color:var(--bg)}
.askbox{margin-top:20px;padding:14px;border-radius:14px;border:2px solid var(--green);background:var(--green-soft)}
.askbox p{margin:0 0 6px;font-size:15px}
.askbox .q2{font-weight:700;font-size:17px;margin-bottom:10px}
.askbox .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.askbox .acts button:not(.ghost){padding:10px 14px;border-radius:10px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-weight:700;cursor:pointer}
.askbox .acts button.solid{background:var(--green);color:var(--bg)}
.cmpbtn{width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1.5px solid var(--tag);background:var(--tag);color:var(--tag-ink);font-weight:700;font-size:16px;cursor:pointer}
.btn{padding:8px 14px;border-radius:10px;border:1.5px solid var(--green);background:transparent;color:var(--green);font-weight:700;cursor:pointer}
.btn.solid{background:var(--green);color:var(--bg)}
.cmpset h3,.cmph{font-family:"Secular One","Assistant",sans-serif;font-weight:400;font-size:19px;margin:18px 0 8px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
.cmpset input{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface)}
.cmpset .acts{display:flex;gap:10px;align-items:center;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600}
.chip.on{background:var(--green);border-color:var(--green);color:var(--bg)}
.cmpsum{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--muted);font-size:15px}
.cmpsum span{flex:1}
details.store{border:1.5px solid var(--line);border-radius:12px;margin-top:8px;background:var(--surface)}
details.store.best{border-color:var(--green);border-width:2px}
details.store summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
details.store summary::-webkit-details-marker{display:none}
.sname{flex:1;display:flex;flex-direction:column;min-width:0}
.sname small,.stot small{color:var(--muted);font-size:13px}
.stot{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap}
.stot b{font-size:18px}
.pline{display:flex;justify-content:space-between;gap:10px;padding:6px 12px;border-top:1px solid var(--line);font-size:15px}
.pline small,.lk{color:var(--muted);font-size:12px}
details.store .hint{padding:6px 12px}
.linkpanel{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 14px calc(20px + env(safe-area-inset-bottom,0px))}
.lhead{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:18px}
.lres{margin-top:8px}
.lrow{display:flex;gap:10px;align-items:center;width:100%;text-align:right;padding:9px 4px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer}
.lrow .ltext{flex:1;display:flex;flex-direction:column}
.lrow small{color:var(--muted);font-size:13px}
.lcheck{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--green);display:grid;place-items:center;color:var(--green);font-weight:700;flex:0 0 auto}
.lrow.on .lcheck{background:var(--green);color:var(--bg)}
.note{display:block;font-size:13px;font-weight:400;color:var(--muted);line-height:1.3}
.row .name{display:flex;flex-direction:column;align-items:flex-start}
.notebtn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:15px;cursor:pointer;display:grid;place-items:center}
.notebtn.has{color:var(--green)}
.noterow{display:flex;gap:6px;align-items:center;padding:6px 0 10px;border-bottom:1px solid var(--line)}
.noterow .noteinput{flex:1;min-width:0;padding:8px 10px;border:1.5px solid var(--green);border-radius:10px;background:var(--surface);font-size:15px}
</style>
<script>window.smartcartAuth = new Promise(r => window.__smartcartResolve = r);</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title">מה קונים השבוע</h1>
    <p id="sub">בוחרים מוצרים וכמויות, ובסופר מסמנים מה כבר בעגלה.</p>
    <div class="userbar"><span id="who"></span><button id="logout" hidden>התנתקות</button><span class="sync" id="sync" aria-live="polite"></span></div>
  </header>
  <div id="offer"></div>
  <main id="main"></main>
</div>
<nav class="tabs" role="tablist">
  <button role="tab" id="tab-pick" aria-selected="true">בחירת מוצרים</button>
  <button role="tab" id="tab-list" aria-selected="false">הרשימה<span class="badge" id="badge" hidden></span></button>
  <button role="tab" id="tab-family" aria-selected="false">משפחה</button>
</nav>
<div class="toast" id="toast" role="status"></div>

<script>
const DEFAULT_CATS = ["פירות וירקות","חלב וביצים","מקרר","לחם ומאפים","בשר, עוף ודגים","יבשים ושימורים","קפואים","שתייה","חטיפים ומתוקים","תבלינים ורטבים","ניקיון ובית","טיפוח והיגיינה"];
const DEFAULT_PRODUCTS = {
  "פירות וירקות":["עגבניות","מלפפונים","בצל","שום","תפוחי אדמה","גזר","פלפל","חסה","לימון","בננות","תפוחים","אבוקדו"],
  "חלב וביצים":["חלב","ביצים","גבינה צהובה","קוטג'","גבינה לבנה","יוגורט","חמאה","שמנת"],
  "מקרר":["חומוס","סלט חצילים","נקניק","פסטרמה","זיתים","חמוצים"],
  "לחם ומאפים":["לחם","פיתות","לחמניות"],
  "בשר, עוף ודגים":["חזה עוף","שניצל","בשר טחון","סלמון"],
  "יבשים ושימורים":["אורז","פסטה","קמח","סוכר","שמן","טונה","תירס","קפה","תה","דגני בוקר"],
  "קפואים":["אפונה קפואה","ירקות קפואים"],
  "שתייה":["מים","סודה","מיץ"],
  "חטיפים ומתוקים":["במבה","ביסלי","שוקולד"],
  "תבלינים ורטבים":["מלח","פלפל שחור","פפריקה","רסק עגבניות","קטשופ","טחינה"],
  "ניקיון ובית":["נייר טואלט","מגבות נייר","סבון כלים","אבקת כביסה","שקיות זבל"],
  "טיפוח והיגיינה":["שמפו","משחת שיניים","סבון גוף"]
};
const LS_KEY = "shopping-list-v1";
const uid = () => Math.random().toString(36).slice(2,10);

function freshState(){
  const catalog = [];
  for (const c of DEFAULT_CATS) for (const n of (DEFAULT_PRODUCTS[c]||[])) catalog.push({id:uid(),name:n,cat:c});
  return {v:1, cats:[...DEFAULT_CATS], catalog, qty:{}, done:{}};
}
function migrate(s){
  let changed = false;
  if (!s.cats.includes("מקרר")){
    const i = s.cats.indexOf("חלב וביצים");
    s.cats.splice(i >= 0 ? i + 1 : s.cats.length, 0, "מקרר");
    for (const n of DEFAULT_PRODUCTS["מקרר"]) s.catalog.push({id:uid(), name:n, cat:"מקרר"});
    changed = true;
  }
  return changed;
}
function valid(s){return s && Array.isArray(s.cats) && Array.isArray(s.catalog) && typeof s.qty==="object"}

let state;
try { const raw = localStorage.getItem(LS_KEY); state = raw ? JSON.parse(raw) : null; } catch(e){ state = null; }
if (!valid(state)) state = freshState();
state.done = state.done || {};
migrate(state);

const viewFromHash = () => ({"#list":"list","#family":"family","#compare":"compare"})[location.hash] || "pick";
let view = viewFromHash();
let editMode = false;
const openCats = new Set();

/* ---------- persistence ---------- */
let dbRef = null, saveTimer = null, saving = false, pending = false, lastSynced = "";
const syncEl = document.getElementById("sync");
function setSync(t){ syncEl.textContent = t; }

function persist(){
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){}
  if (!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (!dbRef) return;
  if (saving){ pending = true; return; }
  const body = JSON.stringify(state);
  if (body === lastSynced) return;
  saving = true; setSync("שומרת…");
  try { await dbRef.set(JSON.parse(body)); lastSynced = body; setSync("מסונכרן"); }
  catch(e){ setSync("נשמר רק במכשיר הזה"); }
  saving = false;
  if (pending){ pending = false; flush(); }
}
(async () => {
  try{
    const ctx = await window.smartcartAuth;
    if (!ctx){ if (!window.__smartcartError) setSync("נשמר במכשיר הזה"); return; }
    dbRef = ctx.ref;
    let first = true;
    const timer = setTimeout(()=>{ if(first) setSync("נשמר במכשיר הזה"); }, 10000);
    dbRef.onSnapshot(snap => {
      const d = snap.exists ? snap.data() : null;
      if (first){
        first = false; clearTimeout(timer);
        if (valid(d)){ state = JSON.parse(JSON.stringify(d)); state.done = state.done||{}; lastSynced = JSON.stringify(state); try{localStorage.setItem(LS_KEY, lastSynced);}catch(e){} if (migrate(state)) persist(); render(); }
        else { flush(); }
        setSync("מסונכרן");
        return;
      }
      if (valid(d) && !saving && !saveTimer_active()){
        const s = JSON.stringify(d);
        if (s !== lastSynced && s !== JSON.stringify(state)){ state = JSON.parse(s); state.done = state.done||{}; lastSynced = s; render(); }
      }
    }, () => setSync("נשמר במכשיר הזה"));
  }catch(e){ setSync("נשמר במכשיר הזה"); }
})();
let saveTimerFlag = false;
function saveTimer_active(){ return saveTimerFlag; }
const _persist = persist;
persist = function(){ saveTimerFlag = true; _persist(); setTimeout(()=>{saveTimerFlag=false}, 1500); };

/* ---------- helpers ---------- */
const main = document.getElementById("main");
function el(tag, attrs={}, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs)){
    if (k==="class") e.className=v; else if (k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if (v===true) e.setAttribute(k,""); else if (v!==false && v!=null) e.setAttribute(k,v);
  }
  for (const k of kids.flat(Infinity)) if (k!=null) e.append(k.nodeType?k:document.createTextNode(k));
  return e;
}
function toast(msg, actionLabel, action){
  const t=document.getElementById("toast");
  t.replaceChildren(el("span",{},msg));
  if (actionLabel) t.append(el("button",{onclick:()=>{ t.classList.remove("show"); action(); }},actionLabel));
  t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), actionLabel?5000:2200);
}
const UNITS = {
  unit:{label:"יח׳", step:1,   start:1,   max:99},
  pack:{label:"חבילה", step:1, start:1,   max:99},
  g:   {label:"גרם", step:100, start:500, max:20000}
};
const defaultUnit = cat => /בשר|עוף/.test(cat) ? "g" : "unit";
const unitOf = p => UNITS[p.unit] ? p.unit : defaultUnit(p.cat);
function fmtQty(p, q){
  const u = unitOf(p);
  if (u === "g") return q >= 1000 ? `${+(q/1000).toFixed(2)} ק״ג` : `${q} גר׳`;
  return `${q} ${u === "pack" ? "חב׳" : "יח׳"}`;
}
function setQty(id, q){
  const p = state.catalog.find(x => x.id === id); if (!p) return;
  q = Math.max(0, Math.min(UNITS[unitOf(p)].max, q));
  if (q===0){ delete state.qty[id]; delete state.done[id]; } else state.qty[id]=q;
  persist(); render();
}
function bump(p, dir){
  const u = UNITS[unitOf(p)], q = state.qty[p.id] || 0;
  if (dir > 0) setQty(p.id, q ? q + u.step : u.start);
  else setQty(p.id, q - u.step < u.step ? 0 : q - u.step);
}
function setUnit(p, unit){
  p.unit = unit;
  if (state.qty[p.id]) state.qty[p.id] = UNITS[unit].start;
  persist(); render();
}
const selected = () => state.catalog.filter(p => state.qty[p.id] > 0);

/* ---------- views ---------- */
function deleteCategory(c){
  const ci = state.cats.indexOf(c); if (ci < 0) return;
  const removed = state.catalog.map((p,i)=>({p,i})).filter(x=>x.p.cat===c);
  const saved = removed.map(({p,i}) => ({p, i, q:state.qty[p.id], d:state.done[p.id]}));
  state.cats.splice(ci,1);
  state.catalog = state.catalog.filter(p => p.cat !== c);
  for (const {p} of removed){ delete state.qty[p.id]; delete state.done[p.id]; }
  openCats.delete(c); persist(); render();
  toast(`הקטגוריה ${c} נמחקה`, "ביטול", () => {
    state.cats.splice(Math.min(ci, state.cats.length), 0, c);
    for (const s of saved){
      state.catalog.splice(Math.min(s.i, state.catalog.length), 0, s.p);
      if (s.q) state.qty[s.p.id] = s.q; if (s.d) state.done[s.p.id] = true;
    }
    persist(); render();
  });
}

let filterText = "";
let noteOpen = null;
function moveProduct(p, cat){
  if (!state.cats.includes(cat) || cat === p.cat) return;
  if (state.catalog.some(x => x !== p && x.cat === cat && x.name === p.name)){ toast(`כבר יש ${p.name} בקטגוריה ${cat}`); render(); return; }
  p.unit = unitOf(p);
  p.cat = cat; openCats.add(cat);
  persist(); render(); toast(`${p.name} הועבר ל${cat}`);
}
function noteEditor(p){
  const inp = el("input",{type:"text",class:"noteinput",maxlength:"80",placeholder:"הערה, למשל: בלי לקטוז / המותג הירוק","aria-label":`הערה ל${p.name}`});
  inp.value = p.note || "";
  const save = () => {
    const v = inp.value.trim();
    if (v) p.note = v; else delete p.note;
    noteOpen = null; persist(); render();
  };
  inp.addEventListener("keydown", e => { if (e.key === "Enter") save(); if (e.key === "Escape"){ noteOpen = null; render(); } });
  setTimeout(() => inp.focus(), 0);
  return el("div",{class:"noterow"}, inp,
    el("button",{class:"btn solid",onclick:save},"שמירה"),
    p.note ? el("button",{class:"ghost",onclick:()=>{ delete p.note; noteOpen = null; persist(); render(); }},"מחיקה") : null);
}

/* ---------- price comparison ---------- */
const PRICE_DATA = "https://raw.githubusercontent.com/MatanDekel/SmartCart/price-data/";
const PD = { index:null, stores:null, bases:{}, storeData:{}, error:null, busy:false, editSettings:false };
async function pdFetch(path){
  const r = await fetch(PRICE_DATA + path, { cache: "no-cache" });
  if (!r.ok) throw new Error(`${r.status} ${path}`);
  return r.json();
}
const cleanTxt = s => (s || "").toLowerCase().replace(/["'״׳`.,()\-–_/\\%]+/g, " ").replace(/\s+/g, " ").trim();
const isShortCode = c => String(c).replace(/\D/g,"").length < 8;
const chainName = key => (PD.index?.chains.find(c => c.key === key) || {}).name || key;
const shek = n => "₪" + n.toFixed(2);

async function loadMeta(){
  if (PD.index && PD.stores) return;
  [PD.index, PD.stores] = await Promise.all([pdFetch("index.json"), pdFetch("stores.json")]);
}
async function loadBase(key){
  if (PD.bases[key]) return PD.bases[key];
  const b = await pdFetch(`chains/${key}/base.json`);
  b.map = new Map(b.codes.map((c, i) => [c, i]));
  b.wset = new Set(b.w || []);
  b.search = b.names.map(cleanTxt);
  return (PD.bases[key] = b);
}
async function loadStore(key, id){
  const k = key + "/" + id;
  if (PD.storeData[k]) return PD.storeData[k];
  const s = await pdFetch(`chains/${key}/stores/${id}.json`);
  const bin = atob(s.b), bits = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bits[i] = bin.charCodeAt(i);
  return (PD.storeData[k] = { bits, d: s.d || {} });
}
const hasIdx = (sd, i) => (sd.bits[i >> 3] >> (i & 7)) & 1;

function priceAt(p, store, base, sd){
  let best = null;
  for (const l of (p.links || [])){
    if (l.chain && l.chain !== store.c) continue;
    const i = base.map.get(l.code);
    if (i === undefined || !hasIdx(sd, i)) continue;
    const unitPrice = sd.d[i] ?? base.prices[i];
    const weighted = base.wset.has(i);
    const q = state.qty[p.id], u = unitOf(p);
    let cost, approx = false;
    if (weighted){ cost = u === "g" ? unitPrice * q / 1000 : unitPrice * q; approx = u !== "g"; }
    else { cost = u === "g" ? unitPrice : unitPrice * q; approx = u === "g"; }
    if (!best || cost < best.cost) best = { cost, unitPrice, weighted, approx, name: base.names[i] };
  }
  return best;
}

function citiesFor(chains){
  const cnt = new Map();
  for (const s of PD.stores) if (chains.includes(s.c) && s.city) cnt.set(s.city, (cnt.get(s.city) || 0) + 1);
  return [...cnt.entries()].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}

  const picked = new Set(cur.chains);

  box.replaceChildren(el("div",{class:"cmpset"},
    el("h3",{},"באילו רשתות אתם קונים?"),
    el("div",{class:"chips"}, PD.index.chains.map(c => {
      const b = el("button",{class:"chip"+(picked.has(c.key)?" on":""),"aria-pressed":String(picked.has(c.key)),onclick:()=>{
        picked.has(c.key) ? picked.delete(c.key) : picked.add(c.key);
        b.classList.toggle("on"); b.setAttribute("aria-pressed", String(picked.has(c.key))); fillCities();
      }}, c.name);
      return b;
    })),
    el("h3",{},"באיזו עיר?"),
    cityIn, dl,
    el("div",{class:"acts"},
      el("button",{class:"btn solid",onclick:()=>{
        const city = cityIn.value.trim();
        if (!picked.size){ toast("צריך לבחור לפחות רשת אחת"); return; }
        if (!city){ toast("צריך לבחור עיר"); cityIn.focus(); return; }
        if (!PD.stores.some(s => picked.has(s.c) && s.city === city)){ toast("לא מצאתי סניפים של הרשתות האלה בעיר הזו. בחרי עיר מהרשימה."); return; }
        state.compare = { chains: [...picked], city }; PD.editSettings = false; persist(); render();
      }},"שמירה"),
      state.compare ? el("button",{class:"ghost",onclick:()=>{ PD.editSettings = false; render(); }},"ביטול") : null)
  ));

function openLinkPanel(p){
  const chains = state.compare.chains.filter(k => PD.bases[k]);
  const panel = el("div",{class:"linkpanel",role:"dialog","aria-modal":"true","aria-label":`קישור ${p.name}`});
  const qIn = el("input",{type:"search",class:"search",value:p.name,"aria-label":"חיפוש מוצר במאגר",enterkeyhint:"search"});
  const results = el("div",{class:"lres"});
  const linked = () => p.links || (p.links = []);
  const keyOf = l => (l.chain || "") + "|" + l.code;
  const draw = () => {
    const words = cleanTxt(qIn.value).split(" ").filter(Boolean);
    const found = new Map();
    for (const k of chains){
      const b = PD.bases[k];
      for (let i = 0; i < b.codes.length && found.size < 400; i++){
        const s = b.search[i];
        if (!words.length || !words.every(w => s.includes(w))) continue;
        const short = isShortCode(b.codes[i]);
        const key = (short ? k : "") + "|" + b.codes[i];
        const f = found.get(key);
        if (f){ f.chains.add(k); f.price = Math.min(f.price, b.prices[i]); }
        else found.set(key, { code: b.codes[i], chain: short ? k : null, name: b.names[i], unit: b.units[i], chains: new Set([k]), price: b.prices[i], w: b.wset.has(i) });
      }
    }
    const L = new Set(linked().map(keyOf));
    const list = [...found.values()]
      .sort((a, b) => (L.has(keyOf(b)) - L.has(keyOf(a))) || (b.chains.size - a.chains.size) || a.name.length - b.name.length)
      .slice(0, 50);
    results.replaceChildren(...(
      list.length ? list.map(r => {
        const on = L.has(keyOf(r));
        return el("button",{class:"lrow"+(on?" on":""),onclick:()=>{
          if (on) p.links = linked().filter(l => keyOf(l) !== keyOf(r));
          else linked().push({ code: r.code, name: r.name, ...(r.chain ? { chain: r.chain } : {}) });
          persist(); draw();
        }},
          el("span",{class:"lcheck","aria-hidden":"true"}, on ? "✓" : "+"),
          el("span",{class:"ltext"},
            el("b",{}, r.name || r.code),
            el("small",{}, [r.unit, [...r.chains].map(chainName).join(" · "), (r.w ? "לק״ג " : "") + "מ־" + shek(r.price)].filter(Boolean).join(" | "))));
      }) : [el("p",{class:"hint",style:"padding:12px 0"},"לא נמצאו מוצרים. נסי מילה אחרת או קצרה יותר.")]
    ));
  };
  let t; qIn.addEventListener("input", () => { clearTimeout(t); t = setTimeout(draw, 150); });
  const close = () => { panel.remove(); document.body.style.overflow = ""; render(); };
  panel.append(el("div",{class:"lhead"},
      el("b",{}, `קישור: ${p.name}`),
      el("button",{class:"btn solid",onclick:close},"סיום")),
    el("p",{class:"hint"},"בחרי מוצר אחד או כמה (למשל כמה מותגים של אותו מוצר). בכל סניף יחושב הזול מביניהם."),
    qIn, results);
  document.body.append(panel); document.body.style.overflow = "hidden";
  draw(); qIn.focus();
}

async function ensureCompareData(){
  if (PD.busy) return;
  PD.busy = true; PD.error = null;
  try {
    await loadMeta();
    if (state.compare){
      await Promise.all(state.compare.chains.filter(k => PD.index.chains.some(c => c.key === k)).map(loadBase));
      const stores = PD.stores.filter(s => state.compare.chains.includes(s.c) && s.city === state.compare.city);
      await Promise.all(stores.map(s => loadStore(s.c, s.id).catch(() => null)));
    }
  } catch(e){ PD.error = e; }
  PD.busy = false;
  if (view === "compare") render();
}

function renderCompare(){
  const back = el("button",{class:"ghost",onclick:()=>{ view="list"; history.replaceState(null,"","#list"); render(); }},"→ חזרה לרשימה");
  const box = el("div");
  main.replaceChildren(back, box);
  if (PD.error){
    box.replaceChildren(el("div",{class:"empty"}, el("b",{},"נתוני המחירים לא זמינים כרגע"),
      "ייתכן שהעדכון היומי עוד לא רץ. אפשר להריץ אותו ב־GitHub: Actions ← Update supermarket prices ← Run workflow.",
      el("p",{style:"direction:ltr;font-size:12px"}, String(PD.error.message || PD.error)),
      el("button",{class:"btn solid",onclick:()=>{ PD.error=null; ensureCompareData(); render(); }},"לנסות שוב")));
    return;
  }
  if (!PD.index || !PD.stores){ box.replaceChildren(el("p",{class:"hint",style:"margin-top:16px"},"טוען נתוני מחירים…")); ensureCompareData(); return; }
  if (!state.compare || PD.editSettings){ renderSettings(box); return; }

  const cfg = state.compare;
  const stores = PD.stores.filter(s => cfg.chains.includes(s.c) && s.city === cfg.city);
  const ready = cfg.chains.every(k => PD.bases[k] || !PD.index.chains.some(c => c.key === k)) && stores.every(s => PD.storeData[s.c + "/" + s.id]);
  if (!ready){ box.replaceChildren(el("p",{class:"hint",style:"margin-top:16px"},"טוען מחירים מהסניפים…")); ensureCompareData(); return; }

  const sel = selected();
  const unlinked = sel.filter(p => !(p.links && p.links.length));
  const linkedSel = sel.filter(p => p.links && p.links.length);

  const results = stores.map(s => {
    const base = PD.bases[s.c], sd = PD.storeData[s.c + "/" + s.id];
    let total = 0, approx = false; const lines = [], missing = [];
    for (const p of linkedSel){
      const r = base && sd ? priceAt(p, s, base, sd) : null;
      if (r){ total += r.cost; approx = approx || r.approx; lines.push({ p, r }); } else missing.push(p);
    }
    return { s, total, approx, lines, missing };
  }).sort((a, b) => (a.missing.length - b.missing.length) || (a.total - b.total));

  const updated = PD.index.updated ? new Date(PD.index.updated).toLocaleDateString("he-IL") : "";
  box.replaceChildren(el("div",{},
    el("div",{class:"cmpsum"},
      el("span",{}, `${cfg.chains.map(chainName).join(", ")} · ${cfg.city}`),
      el("button",{class:"ghost",onclick:()=>{ PD.editSettings = true; render(); }},"שינוי")),
    !sel.length ? el("div",{class:"empty"}, el("b",{},"הרשימה ריקה"),"בחרי מוצרים כדי להשוות מחירים.") : null,
    unlinked.length ? el("div",{class:"askbox"},
      el("p",{class:"q2"}, `${unlinked.length} מוצרים עוד לא מקושרים למוצר בסופר`),
      el("p",{},"קישור עושים פעם אחת, והוא נשמר לפעמים הבאות. מוצר לא מקושר לא נכנס לחישוב."),
      unlinked.map(p => el("div",{class:"row"}, el("span",{class:"ltxt",style:"flex:1"},p.name), el("button",{class:"btn",onclick:()=>openLinkPanel(p)},"קישור")))) : null,
    linkedSel.length ? [
      el("h3",{class:"cmph"}, `הסניפים הזולים ב${cfg.city}`),
      results.length ? results.slice(0, 10).map((x, i) => {
        const det = el("details",{class:"store"+(i===0 && !x.missing.length ? " best" : "")},
          el("summary",{},
            el("span",{class:"sname"}, el("b",{}, `${chainName(x.s.c)} – ${x.s.n}`), el("small",{}, x.s.addr || "")),
            el("span",{class:"stot"}, el("b",{}, (x.approx ? "~" : "") + shek(x.total)),
              el("small",{}, x.missing.length ? `חסרים ${x.missing.length}` : "הכול נמצא"))),
          x.lines.map(({p, r}) => el("div",{class:"pline"}, el("span",{}, p.name, el("small",{}, " " + r.name)), el("span",{}, (r.approx ? "~" : "") + shek(r.cost)))),
          x.missing.length ? el("p",{class:"hint"}, "לא נמצאו בסניף: " + x.missing.map(p => p.name).join(", ")) : null);
        return det;
      }) : el("p",{class:"hint"},"אין סניפים של הרשתות שבחרת בעיר הזו."),
      el("h3",{class:"cmph"},"מוצרים מקושרים"),
      linkedSel.map(p => el("div",{class:"row"},
        el("span",{class:"ltxt",style:"flex:1"}, p.name, el("small",{class:"lk"}, " " + p.links.map(l => l.name).join(" / "))),
        el("button",{class:"ghost",onclick:()=>openLinkPanel(p)},"שינוי")))
    ] : null,
    el("p",{class:"hint",style:"margin-top:16px"}, `מחירי מדף ללא מבצעים${updated ? " · עודכן " + updated : ""}. ~ = מחיר משוער (מוצר במשקל לעומת יחידות).`)
  ));
}

function render(){
  for (const v of ["pick","list","family"]) document.getElementById("tab-"+v).setAttribute("aria-selected", view===v || (v==="list" && view==="compare"));
  const n = selected().length, b = document.getElementById("badge");
  b.hidden = !n; b.textContent = n;
  document.getElementById("sub").textContent = {
    pick: "בוחרים מוצרים וכמויות, ובסופר מסמנים מה כבר בעגלה.",
    list: "לחיצה על מוצר מסמנת שהוא כבר בעגלה.",
    family: "כל מי שבמשפחה רואה ועורך את אותה רשימה.",
    compare: "כמה תעלה הרשימה בכל סניף בעיר שלך."
  }[view];
  if (view==="pick") renderPick();
  else if (view==="list") renderList();
  else if (view==="compare") renderCompare();
  else if (window.renderFamilyView) window.renderFamilyView(main);
  else main.replaceChildren(el("p",{class:"hint",style:"margin-top:20px"},"טוען…"));
}
for (const v of ["pick","list","family"])
  document.getElementById("tab-"+v).onclick = ()=>{ view=v; history.replaceState(null,"","#"+v); render(); scrollTo(0,0); };
window.addEventListener("hashchange",()=>{ view = viewFromHash(); render(); });
render();
</script>
<script type="module">
import { configured, auth, db } from "./auth.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, where, onSnapshot, arrayUnion, arrayRemove, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const show = () => document.documentElement.classList.remove("auth-pending");
const JOIN_KEY = "smartcartJoin";
const params = new URLSearchParams(location.search);
if (params.get("join")){
  try { localStorage.setItem(JOIN_KEY, params.get("join")); } catch(e){}
  history.replaceState(null, "", location.pathname + location.hash);
}
const getPending = () => { try { return localStorage.getItem(JOIN_KEY); } catch(e){ return null; } };
const clearPending = () => { try { localStorage.removeItem(JOIN_KEY); } catch(e){} };
const randCode = () => Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2,"0")).join("");
const lc = s => (s || "").trim().toLowerCase();

let ME = null, FID = null, FAMILY = null, MEMBERS = [];

async function joinFamily(user, fid, code){
  await setDoc(doc(db,"families",fid,"members",user.uid), { email: lc(user.email), code: code || null, joinedAt: serverTimestamp() });
  await setDoc(doc(db,"users",user.uid), { familyId: fid }, { merge: true });
  try { await updateDoc(doc(db,"families",fid), { invitedEmails: arrayRemove(lc(user.email)) }); } catch(e){}
  clearPending();
}
async function createFamily(user){
  const ref = doc(collection(db,"families"));
  await setDoc(ref, { ownerUid: user.uid, inviteCode: randCode(), invitedEmails: [], createdAt: serverTimestamp() });
  await setDoc(doc(db,"families",ref.id,"members",user.uid), { email: lc(user.email), joinedAt: serverTimestamp() });
  try {
    const old = await getDoc(doc(db,"users",user.uid,"lists","shopping"));
    if (old.exists()) await setDoc(doc(db,"families",ref.id,"lists","shopping"), old.data());
  } catch(e){}
  await setDoc(doc(db,"users",user.uid), { familyId: ref.id }, { merge: true });
  return ref.id;
}
async function emailInvites(user){
  if (!user.email || !user.emailVerified) return [];
  try {
    const s = await getDocs(query(collection(db,"families"), where("invitedEmails","array-contains", lc(user.email))));
    return s.docs.map(d => d.id);
  } catch(e){ return []; }
}
async function currentFamily(user){
  try {
    const prof = await getDoc(doc(db,"users",user.uid));
    const fid = prof.exists() ? prof.data().familyId : null;
    if (!fid) return null;
    const m = await getDoc(doc(db,"families",fid,"members",user.uid));
    return m.exists() ? fid : null;
  } catch(e){ return null; }
}
async function resolveFamily(user){
  let fid = await currentFamily(user);
  const pending = getPending();
  const [pf, pc] = pending ? pending.split(".") : [];
  const invites = (await emailInvites(user)).filter(id => id !== fid);
  if (!fid){
    if (pf){
      try { await joinFamily(user, pf, pc); return { fid: pf, joined: true }; }
      catch(e){ clearPending(); toast("קישור ההזמנה לא תקף או שפג תוקפו"); }
    }
    if (invites.length){ await joinFamily(user, invites[0], null); return { fid: invites[0], joined: true }; }
    return { fid: await createFamily(user) };
  }
  if (pf === fid) clearPending();
  const offer = (pf && pf !== fid) ? { fid: pf, code: pc } : (invites.length ? { fid: invites[0], code: null } : null);
  return { fid, offer };
}

function showOffer(offer){
  const box = document.getElementById("offer");
  if (!offer){ box.replaceChildren(); return; }
  const join = el("button",{class:"solid",onclick: async () => {
    join.disabled = true;
    try { await joinFamily(ME, offer.fid, offer.code); location.reload(); }
    catch(e){ clearPending(); toast("קישור ההזמנה לא תקף או שפג תוקפו"); box.replaceChildren(); }
  }},"הצטרפות");
  box.replaceChildren(
    el("p",{},"הוזמנת להצטרף לסל קניות משפחתי. אחרי ההצטרפות תראי את הרשימה המשותפת במקום הרשימה הנוכחית."),
    el("div",{class:"acts"}, join, el("button",{onclick:()=>{ clearPending(); box.replaceChildren(); }},"לא עכשיו"))
  );
}

const inviteLink = () => FAMILY ? `${location.origin}/?join=${FID}.${FAMILY.inviteCode}` : "";
const rerenderFamily = () => { if (view === "family") render(); };

window.renderFamilyView = (main) => {
  if (window.__smartcartError){
    const e = window.__smartcartError;
    const perm = e && e.code === "permission-denied";
    main.replaceChildren(el("div",{class:"fam"},
      el("h3",{},"לא הצלחתי להתחבר לרשימה המשפחתית"),
      el("p",{}, perm
        ? "Firebase חסם את הגישה. כנראה ה־Rules ב־Firestore עוד לא עודכנו לגרסה החדשה (עם המשפחות), או שלא לחצו Publish."
        : "קרתה שגיאה בחיבור ל־Firebase."),
      el("p",{style:"direction:ltr;text-align:right;font-size:13px"}, `${e && e.code || ""} ${e && e.message || e}`),
      el("button",{class:"btn solid",onclick:()=>location.reload()},"לנסות שוב")));
    return;
  }
  if (!FAMILY){ main.replaceChildren(el("p",{class:"hint",style:"margin-top:20px"},"טוען…")); return; }
  const isOwner = FAMILY.ownerUid === ME.uid;
  const link = inviteLink();

  const emailIn = el("input",{type:"email",placeholder:"name@gmail.com",autocomplete:"off","aria-label":"מייל להזמנה",inputmode:"email"});
  const invite = async () => {
    const em = lc(emailIn.value);
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ toast("כתובת המייל לא תקינה"); emailIn.focus(); return; }
    if (MEMBERS.some(m => m.email === em)){ toast("הוא/היא כבר במשפחה"); return; }
    try { await updateDoc(doc(db,"families",FID), { invitedEmails: arrayUnion(em) }); }
    catch(e){ toast("ההזמנה לא נשמרה. נסי שוב."); return; }
    const subject = "הזמנה לרשימת הקניות המשפחתית";
    const body = `היי! הוספתי אותך לרשימת הקניות המשותפת שלנו ב־SmartCart.\n\nנכנסים בקישור ומתחברים עם ${em}:\n${link}`;
    location.href = `mailto:${em}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    toast("ההזמנה נשמרה. ברגע שיתחברו עם המייל הזה, הם יצטרפו אוטומטית.");
  };
  emailIn.addEventListener("keydown", e => { if (e.key === "Enter") invite(); });

  const linkIn = el("input",{type:"text",readonly:true,value:link,"aria-label":"קישור הזמנה",onfocus:e=>e.target.select()});
  const copy = async () => {
    try { await navigator.clipboard.writeText(link); toast("הקישור הועתק"); }
    catch(e){ linkIn.focus(); linkIn.select(); toast("סמני את הקישור והעתיקי"); }
  };
  const share = async () => {
    const text = "הצטרפו לרשימת הקניות המשפחתית שלנו:";
    if (navigator.share){ try { await navigator.share({ title: "SmartCart", text, url: link }); } catch(e){} }
    else window.open(`https://wa.me/?text=${encodeURIComponent(text + " " + link)}`, "_blank", "noopener");
  };
  const rotate = async () => {
    try { await updateDoc(doc(db,"families",FID), { inviteCode: randCode() }); toast("נוצר קישור חדש. הקישור הקודם כבר לא עובד."); }
    catch(e){ toast("לא הצלחתי ליצור קישור חדש"); }
  };

  const leave = el("button",{class:"del leave",onclick: async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.armed){ b.dataset.armed = "1"; b.textContent = "לחיצה נוספת – עזיבה ויצירת רשימה חדשה משלך"; setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent = "עזיבת המשפחה"; } }, 4000); return; }
    try {
      const others = MEMBERS.filter(m => m.uid !== ME.uid);
      if (isOwner && others.length) await updateDoc(doc(db,"families",FID), { ownerUid: others[0].uid });
      await deleteDoc(doc(db,"families",FID,"members",ME.uid));
      await setDoc(doc(db,"users",ME.uid), { familyId: null }, { merge: true });
      location.reload();
    } catch(err){ toast("לא הצלחתי לעזוב. נסי שוב."); }
  }},"עזיבת המשפחה");

  main.replaceChildren(el("div",{class:"fam"},
    el("h3",{},`מי במשפחה (${MEMBERS.length})`),
    MEMBERS.map(m => el("div",{class:"row"},
      el("span",{class:"who"}, m.email || "ללא מייל"),
      m.uid === FAMILY.ownerUid ? el("span",{class:"tagme"},"מנהל/ת") : null,
      m.uid === ME.uid ? el("span",{class:"tagme"},"(את/ה)") : null,
      isOwner && m.uid !== ME.uid ? el("button",{class:"del",onclick: async () => {
        try { await deleteDoc(doc(db,"families",FID,"members",m.uid)); toast(`${m.email} הוסר/ה מהמשפחה`); }
        catch(e){ toast("לא הצלחתי להסיר"); }
      }},"הסרה") : null
    )),

    el("h3",{},"הזמנה במייל"),
    el("p",{},"מכניסים את המייל של בן/בת המשפחה. כשיתחברו לאתר עם המייל הזה (הכי פשוט: עם Google), הם יצטרפו לרשימה אוטומטית. בנוסף ייפתח מייל מוכן לשליחה עם קישור."),
    el("div",{class:"linkbox"}, emailIn, el("button",{class:"btn solid",onclick:invite},"הזמנה")),
    (FAMILY.invitedEmails || []).length ? [
      el("p",{style:"margin-top:12px"},"ממתינים להצטרפות:"),
      FAMILY.invitedEmails.map(em => el("div",{class:"row"},
        el("span",{class:"who"}, em),
        el("button",{class:"del",onclick: async () => {
          try { await updateDoc(doc(db,"families",FID), { invitedEmails: arrayRemove(em) }); } catch(e){ toast("לא הצלחתי לבטל"); }
        }},"ביטול")))
    ] : null,

    el("h3",{},"קישור הזמנה"),
    el("p",{},"כל מי שנכנס בקישור ומתחבר מצטרף למשפחה. שלחו אותו רק למי שאתם רוצים."),
    el("div",{class:"linkbox"}, linkIn),
    el("div",{class:"linkbox"},
      el("button",{class:"btn solid",onclick:share},"שיתוף"),
      el("button",{class:"btn",onclick:copy},"העתקה"),
      el("button",{class:"ghost",onclick:rotate},"יצירת קישור חדש")),

    MEMBERS.length > 1 ? leave : null
  ));
};

if (!configured){ window.__smartcartResolve(null); show(); }
else {
  let started = false;
  onAuthStateChanged(auth, async user => {
    if (!user){ location.replace("/login#login"); return; }
    if (started) return;
    started = true; ME = user;
    document.getElementById("who").textContent = user.email;
    const lo = document.getElementById("logout");
    lo.hidden = false;
    lo.onclick = async () => { await signOut(auth); try{ localStorage.removeItem("shopping-list-v1"); }catch(e){} location.replace("/login#login"); };
    show();

    let res;
    try { res = await resolveFamily(user); }
    catch(e){
      console.error(e);
      window.__smartcartError = e;
      setSync("לא מחובר לרשימה המשפחתית");
      window.__smartcartResolve(null);
      rerenderFamily();
      return;
    }
    FID = res.fid;
    if (res.joined) toast("הצטרפת לרשימה המשפחתית");
    showOffer(res.offer);

    onSnapshot(doc(db,"families",FID), s => { FAMILY = s.exists() ? s.data() : null; rerenderFamily(); }, () => {});
    onSnapshot(collection(db,"families",FID,"members"), s => {
      MEMBERS = s.docs.map(d => ({ uid: d.id, ...d.data() }));
      if (!MEMBERS.some(m => m.uid === ME.uid) && s.metadata && !s.metadata.fromCache) location.reload();
      rerenderFamily();
    }, () => location.reload());

    const ref = doc(db,"families",FID,"lists","shopping");
    window.__smartcartResolve({
      ref: {
        set: data => setDoc(ref, data),
        onSnapshot: (next, err) => onSnapshot(ref, s => next({ exists: s.exists(), data: () => s.data() }), err)
      }
    });
  });
}
</script>
